<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Background Gradient: Dark Blue to Deep Navy -->
        <radialGradient id="bgGrad" cx="40%" cy="40%" r="80%">
            <stop offset="0%" stop-color="#052899" />
            <stop offset="100%" stop-color="#00072b" />
        </radialGradient>
        
        <!-- Document Body Gradient: White to Light Gray -->
        <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e8edf2" />
        </linearGradient>

        <!-- Fold Gradient: Bright Blue to Deep Blue -->
        <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0055ff" />
            <stop offset="100%" stop-color="#0022aa" />
        </linearGradient>

        <!-- Speed Lines Gradient: Glowing Cyan to Blue -->
        <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0066ff" />
            <stop offset="100%" stop-color="#00bfff" />
        </linearGradient>

        <!-- Shadows for 3D depth -->
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="15" dy="20" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <filter id="foldShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00bfff" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Main Rounded Background -->
    <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

    <!-- Group containing the stylized 'P' and folded paper -->
    <g filter="url(#shadow)">
        <!-- The Main 'P' Shape (Document + Loop with Hole) -->
        <path d="
            M 170 90
            L 320 90
            C 430 90, 470 140, 470 210
            C 470 280, 420 320, 320 320
            L 290 320
            L 290 410
            Q 290 430, 270 430
            L 130 430
            Q 110 430, 110 410
            L 110 170
            Z
            
            M 290 160
            L 320 160
            C 365 160, 395 180, 395 210
            C 395 240, 365 260, 320 260
            L 290 260
            Z
        " fill="url(#pGrad)" fill-rule="evenodd" />
    </g>

    <!-- The Top-Left Fold (Triangle) -->
    <path d="M 108 172 L 172 88 L 172 172 Z" fill="url(#foldGrad)" filter="url(#foldShadow)" />

    <!-- Inner Content (Face brackets, silhouette, lines) -->
    <!-- Scanning Brackets -->
    <g stroke="#0055ff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 140 180 L 140 160 L 160 160" />
        <path d="M 240 160 L 260 160 L 260 180" />
        <path d="M 140 320 L 140 340 L 160 340" />
        <path d="M 240 340 L 260 340 L 260 320" />
    </g>

    <!-- Silhouette Profile -->
    <circle cx="200" cy="220" r="35" fill="#00184a"/>
    <path d="M 200 260 C 170 260, 140 280, 140 310 L 140 320 Q 140 325, 145 325 L 255 325 Q 260 325, 260 320 L 260 310 C 260 280, 230 260, 200 260 Z" fill="#00184a"/>
    <!-- Suit V-Neck Cutout (White Triangle overlapping the chest) -->
    <path d="M 200 326 L 180 285 L 220 285 Z" fill="url(#pGrad)"/>

    <!-- Bottom Document Lines -->
    <g stroke-linecap="round">
        <!-- Full width line -->
        <line x1="140" y1="370" x2="260" y2="370" stroke="#00184a" stroke-width="10" />
        <!-- Partial line left -->
        <line x1="140" y1="395" x2="200" y2="395" stroke="#00184a" stroke-width="10" />
        <!-- Accent blue line right -->
        <line x1="220" y1="395" x2="260" y2="395" stroke="#0055ff" stroke-width="10" />
    </g>

    <!-- Speed Lines (Motion effect) outside on the bottom right -->
    <g stroke="url(#speedGrad)" stroke-linecap="round" filter="url(#glow)">
        <line x1="320" y1="365" x2="430" y2="365" stroke-width="12" />
        <line x1="320" y1="395" x2="390" y2="395" stroke-width="12" />
        <line x1="320" y1="425" x2="360" y2="425" stroke-width="12" />
    </g>
</svg>
