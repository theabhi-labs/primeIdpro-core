[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    "app",
    ".venv/Lib/site-packages"
]
reportMissingImports = "none"
reportMissingTypeStubs = "none"

[tool.pyrefly]
project_roots = ["."]
search_paths = [
    ".",
    "app",
    ".venv/Lib/site-packages"
]
extraPaths = [
    ".",
    "app",
    ".venv/Lib/site-packages"
]
python_interpreter = ".venv/Scripts/python.exe"
pythonPath = ".venv/Scripts/python.exe"
venv = ".venv"
disabled_rules = ["unresolved-import", "missing-import", "uninitialized-variable", "possibly-unbound"]
disabledRules = ["unresolved-import", "missing-import", "uninitialized-variable", "possibly-unbound"]
