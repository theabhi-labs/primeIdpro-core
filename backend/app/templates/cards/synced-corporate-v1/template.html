<style>
  .card-container {
    width: 100cqw;
    height: 100cqh;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: white;
    font-family: sans-serif;
    position: relative;
    border-radius: 4cqw;
    overflow: hidden;
  }
  .header {
    height: 25cqh;
    background: {{ organization.themeColor | default('#2563eb') }};
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6cqw;
    font-weight: bold;
  }
  .photo {
    width: 35cqw;
    height: 45cqw;
    background-color: white;
    border: 1cqw solid white;
    border-radius: 2cqw;
    margin: 5cqh auto;
    background-image: url('{{ photo }}');
    background-size: cover;
    background-position: center;
  }
  .name {
    text-align: center;
    font-size: 5.5cqw;
    font-weight: bold;
    margin-bottom: 2cqh;
  }
  .dept {
    text-align: center;
    font-size: 4cqw;
    color: #cbd5e1;
  }
  .synced-badge {
    position: absolute;
    bottom: 2cqw;
    right: 2cqw;
    font-size: 3cqw;
    color: #10b981;
  }
</style>
<div class="card-container">
  <div class="header">{{ organization.name | uppercase }}</div>
  <div class="photo"></div>
  <div class="name">{{ name | uppercase }}</div>
  <div class="dept">{{ department | titlecase }}</div>
  <div class="dept">ID: {{ employeeId }}</div>
  <div class="synced-badge">⚡ Cloud Synced</div>
</div>
